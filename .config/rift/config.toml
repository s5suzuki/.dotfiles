[settings]
animate = true
animation_duration = 0.3
animation_fps = 100.0

default_disable = false

focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = true

auto_focus_blacklist = []

run_on_start = []

hot_reload = true

[settings.layout]
mode = "scrolling"

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "master"

[settings.layout.scrolling]
column_width_ratio = 0.7
min_column_width_ratio = 0.3
max_column_width_ratio = 0.9
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
enabled = true
invert_horizontal = false
fingers = 3
propagate_to_workspace_swipe = true

[settings.layout.stack]
stack_offset = 40.0

default_orientation = "perpendicular"

[settings.layout.gaps]

[settings.layout.gaps.outer]
top = 0
left = 0
bottom = 0
right = 0

[settings.layout.gaps.inner]
horizontal = 0
vertical = 0

[settings.ui.menu_bar]
enabled = true
show_empty = true
mode = "all"
active_label = "index"
display_style = "layout"

[settings.ui.stack_line]
enabled = false
horiz_placement = "top"
vert_placement = "left"
thickness = 20.0
spacing = 1.0

[settings.ui.mission_control]
enabled = true
fade_enabled = false
fade_duration_ms = 180.0

[settings.gestures]
enabled = true
consume_dock_swipe = true
invert_horizontal_swipe = false
swipe_vertical_tolerance = 0.4
skip_empty = true
fingers = 3
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
default_workspace_count = 2
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
reapply_app_rules_on_title_change = false

workspace_rules = []

workspace_names = [
	"Top",
	"Bottom"
]

app_rules = []

[modifier_combinations]
comb1 = "Meta + Ctrl"

[keys]
"Meta + H" = { move_focus = "left" }
"Meta + L" = { move_focus = "right" }
"Meta + K" = { switch_to_workspace = 0 }
"Meta + J" = { switch_to_workspace = 1 }
"comb1 + H" = { move_node = "left" }
"comb1 + L" = { move_node = "right" }
"comb1 + K" = { move_window_to_workspace = 0 }
"comb1 + J" = { move_window_to_workspace = 1 }
"Meta + Shift + H" = { move_mouse_to_display = "left" }
"Meta + Shift + L" = { move_mouse_to_display = "right" }
"comb1 + F" = "toggle_fullscreen_within_gaps"
"comb1 + V" = "toggle_window_floating"
"Meta + T" = { "exec" = ["/bin/bash", "-c", "open -na Ghostty"] }
"Meta + O" = "show_mission_control_all"
"Meta + Alt + L" = { "exec" = ["/usr/bin/osascript", "-e", "tell application \"System Events\" to keystroke \"q\" using {control down, command down}"] }
