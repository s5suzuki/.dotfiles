[settings]
animate = true
animation_duration = 0.3
animation_fps = 100.0

default_disable = false

focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = true

auto_focus_blacklist = []

run_on_start = []

hot_reload = true

[settings.layout]
mode = "scrolling"

[settings.layout.master_stack]
master_ratio = 0.6
master_count = 1
master_side = "left"
new_window_placement = "master"

[settings.layout.scrolling]
column_width_ratio = 0.7
min_column_width_ratio = 0.3
max_column_width_ratio = 0.9
preset_column_widths = [0.33333, 0.5, 0.66667]
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.scrolling.gestures]
enabled = true
invert_horizontal = false
fingers = 3
propagate_to_workspace_swipe = true

[settings.layout.stack]
stack_offset = 40.0

default_orientation = "perpendicular"

[settings.layout.gaps]

[settings.layout.gaps.outer]
top = 0
left = 0
bottom = 0
right = 0

[settings.layout.gaps.inner]
horizontal = 0
vertical = 0

[settings.ui.menu_bar]
enabled = true
show_empty = true
mode = "all"
active_label = "index"
display_style = "layout"

[settings.ui.stack_line]
enabled = false
horiz_placement = "top"
vert_placement = "left"
thickness = 20.0
spacing = 1.0

[settings.ui.mission_control]
enabled = true
fade_enabled = false
fade_duration_ms = 180.0

[settings.gestures]
enabled = true
consume_dock_swipe = true
invert_horizontal_swipe = false
swipe_vertical_tolerance = 0.4
skip_empty = true
fingers = 3
distance_pct = 0.08
haptics_enabled = true
haptic_pattern = "level_change"

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
default_workspace_count = 2
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = true
reapply_app_rules_on_title_change = false

workspace_rules = []

workspace_names = [
	"Top",
	"Bottom"
]

app_rules = []

[modifier_combinations]
mod = "Alt + Meta"
modc = "Alt + Meta + Ctrl"
mods = "Alt + Meta + Shift"
modcs = "Alt + Meta + Ctrl + Shift"

[keys]
"mod + T" = { "exec" = ["/bin/bash", "-c", "open -na Ghostty"] }
"mod + Space" = { "exec" = ["/usr/bin/open", "-a", "Raycast"] }
"mod + O" = "show_mission_control_all"
"mod + Q" = "close_window"
"mods + S" = { "exec" = ["/usr/sbin/screencapture", "-ic"] }
"modcs + S" = { "exec" = ["/usr/sbin/screencapture", "-c"] }

"mod + H" = { move_focus = "left" }
"mod + L" = { move_focus = "right" }
"mod + Left" = { move_focus = "left" }
"mod + Right" = { move_focus = "right" }
"mod + J" = "next_workspace"
"mod + K" = "prev_workspace"
"mod + Down" = "next_workspace"
"mod + Up" = "prev_workspace"
"mod + U" = "next_workspace"
"mod + I" = "prev_workspace"
"mod + 1" = { switch_to_workspace = 0 }
"mod + 2" = { switch_to_workspace = 1 }

"modc + H" = { move_node = "left" }
"modc + L" = { move_node = "right" }
"modc + Left" = { move_node = "left" }
"modc + Right" = { move_node = "right" }
"modc + J" = { move_window_to_workspace = { workspace = "next", follow = true } }
"modc + K" = { move_window_to_workspace = { workspace = "prev", follow = true } }
"modc + Down" = { move_window_to_workspace = { workspace = "next", follow = true } }
"modc + Up" = { move_window_to_workspace = { workspace = "prev", follow = true } }
"modc + U" = { move_window_to_workspace = { workspace = "next", follow = true } }
"modc + I" = { move_window_to_workspace = { workspace = "prev", follow = true } }
"modc + 1" = { move_window_to_workspace = 0 }
"modc + 2" = { move_window_to_workspace = 1 }

"mods + H" = { focus_display = "left" }
"mods + L" = { focus_display = "right" }
"mods + J" = { focus_display = "down" }
"mods + K" = { focus_display = "up" }
"modcs + H" = { move_window_to_display = { selector = "left" } }
"modcs + L" = { move_window_to_display = { selector = "right" } }
"modcs + J" = { move_window_to_display = { selector = "down" } }
"modcs + K" = { move_window_to_display = { selector = "up" } }

"mod + BracketLeft" = { consume_or_expel_window = "left" }
"mod + BracketRight" = { consume_or_expel_window = "right" }
"mod + Comma" = { join_window = "right" }
"mod + Period" = "unjoin_windows"
"mod + W" = "toggle_stack"
"mod + C" = "center_selection"

"mod + R" = "switch_preset_column_width"
"mod + F" = "toggle_fullscreen_within_gaps"
"mods + F" = "toggle_fullscreen"
"mod + M" = "toggle_fullscreen"
"mod + Minus" = "resize_window_shrink"
"mod + Equal" = "resize_window_grow"
"mods + Minus" = { resize_window_shrink = "vertical" }
"mods + Equal" = { resize_window_grow = "vertical" }

"mod + V" = "toggle_window_floating"
"mods + V" = "toggle_focus_floating"
